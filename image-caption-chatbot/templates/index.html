<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Caption Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #667eea; margin-bottom: 30px; }
        .upload-area { border: 3px dashed #667eea; border-radius: 15px; padding: 40px; text-align: center; cursor: pointer; margin-bottom: 20px; }
        .upload-area:hover { background: #f8f9ff; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 1.1em; cursor: pointer; margin: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #preview { max-width: 100%; max-height: 400px; margin: 20px auto; display: none; border-radius: 10px; }
        .result-box { background: #f8f9ff; padding: 20px; border-radius: 10px; margin-top: 20px; display: none; }
        .result-box.success { border-left: 5px solid #4caf50; }
        .result-box.error { border-left: 5px solid #f44336; }
        .caption-text { font-size: 1.3em; color: #333; margin-top: 10px; font-style: italic; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Image Caption Generator</h1>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <h2>📸 Click to Upload Image</h2>
            <p>Supported: JPG, PNG, GIF, WEBP (Max 16MB)</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        <div style="text-align: center;">
            <button class="btn" id="captionBtn" onclick="generateCaption()" disabled>✨ Generate Caption</button>
        </div>
        <img id="preview" alt="Preview">
        <div class="loader" id="loader"></div>
        <div class="result-box" id="resultBox">
            <h3 id="resultTitle"></h3>
            <p class="caption-text" id="captionText"></p>
        </div>
    </div>
    <script>
        let selectedFile = null;
        document.getElementById('fileInput').addEventListener('change', function(e) {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').src = e.target.result;
                    document.getElementById('preview').style.display = 'block';
                };
                reader.readAsDataURL(selectedFile);
                document.getElementById('captionBtn').disabled = false;
            }
        });
        async function generateCaption() {
            if (!selectedFile) return;
            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';
            const formData = new FormData();
            formData.append('file', selectedFile);
            try {
                const response = await fetch('/api/caption', { method: 'POST', body: formData });
                const data = await response.json();
                document.getElementById('loader').style.display = 'none';
                const resultBox = document.getElementById('resultBox');
                resultBox.style.display = 'block';
                resultBox.className = 'result-box ' + data.status;
                document.getElementById('resultTitle').textContent = data.status === 'success' ? '✅ Caption Generated!' : '❌ Error';
                document.getElementById('captionText').textContent = data.status === 'success' ? data.caption : data.message;
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
